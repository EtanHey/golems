<!doctype html>
<html lang="en" data-dashboard-type="decision-flow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a2c">
<title>{{TITLE}}</title>
<style>{{STYLES}}</style>
</head>
<body data-storage-key="{{STORAGE_KEY}}" data-view="list">
  <div class="df-layout">
    <header class="df-top">
      <p class="df-kicker">{{KICKER}}</p>
      {{MODE_SWITCH}}
      <h1>{{HEADING}}</h1>
      {{CONTEXT}}
      <p class="df-storage-state" id="df-storage-state" aria-live="polite"></p>
    </header>
    {{CONTROLLER}}
    <aside class="df-side">
      <nav class="df-index" aria-label="Decisions">{{INDEX}}</nav>
      <section class="df-dock" aria-label="Decision progress">
        <p class="df-tally"><b id="df-answered">0</b> of {{DECISION_COUNT}} answered, <span id="df-remaining">{{DECISION_COUNT}}</span> left</p>
        <span class="df-meter" aria-hidden="true"><i id="df-meter-fill"></i></span>
        <button type="button" id="df-copy">Copy answers</button>
      </section>
    </aside>
    <main class="df-ledger">{{CARDS}}</main>
  </div>
  <div class="df-story-top" id="df-story-top"><p class="df-story-count" id="df-story-count"></p><button type="button" class="df-story-copy">Copy answers</button><button type="button" class="df-story-exit" id="df-story-exit">List view</button></div>
  <div class="df-sheet-backdrop" id="df-sheet-backdrop" hidden></div>
  <p class="df-copy-state" id="df-copy-state" aria-live="polite"></p>
  <p class="df-sr-only" id="df-seek-help">Use Left and Right arrows to choose a word, then Enter to seek. Home and End choose the first and last word.</p>
  <p class="df-sr-only" id="df-seek-state" aria-live="polite"></p>
  <button type="button" id="df-cite" hidden aria-haspopup="dialog" aria-controls="df-note-dialog">❞ Cite</button>
  <dialog class="df-note-dialog" id="df-note-dialog" aria-labelledby="df-note-title" aria-describedby="df-note-quote" aria-modal="true">
    <h2 id="df-note-title">Cite &amp; note</h2><p id="df-note-card"></p>
    <blockquote id="df-note-quote"></blockquote>
    <label for="df-note-text">Your note</label><textarea id="df-note-text" rows="4"></textarea>
    <p id="df-note-error" role="alert"></p>
    <div class="df-note-actions"><button type="button" id="df-note-delete" hidden>Delete note</button><button type="button" id="df-note-copy-draft" hidden>Copy draft</button><button type="button" id="df-note-cancel">Cancel</button><button type="button" id="df-note-save">Save note</button></div>
    <div id="df-note-list" aria-label="Saved notes"></div>
  </dialog>
  {{COMPARE_DIALOG}}
  <script id="tpdata" type="application/json">{{TPDATA}}</script>
  <script>{{SCRIPT}}</script>
</body>
</html>
