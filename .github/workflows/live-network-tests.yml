name: live-network-tests

# Tests that call live third-party APIs (Greenhouse, Lever, ...) skip unless
# GOLEMS_NETWORK_TESTS=1, so the PR suites never depend on the network. This
# workflow is where they still run: weekly and on demand, never as a PR check.
# A red run here means an upstream API changed or broke; it shows as a failed
# run in the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-network:
    name: Live network tests (GOLEMS_NETWORK_TESTS=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # Every test file that gates on GOLEMS_NETWORK_TESTS, found at run time so
      # a new opt-in test is picked up without editing this workflow.
      - name: Run the opt-in live tests
        env:
          GOLEMS_NETWORK_TESTS: "1"
        run: |
          mapfile -t files < <(git grep -l 'GOLEMS_NETWORK_TESTS' -- 'packages/**/*.test.ts')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no test file gates on GOLEMS_NETWORK_TESTS; nothing to run"
            exit 1
          fi
          printf 'Running: %s\n' "${files[@]}"
          bun test "${files[@]/#/./}"
