name: stalker-chat

on:
  pull_request:
    paths:
      - "scripts/build-twitch-chat-lurker.sh"
      - "scripts/dist/twitch-chat-lurker.js"
      - "scripts/dist/twitch-chat-lurker.LICENSE.txt"
      - "scripts/lib/stream-helpers.sh"
      - "scripts/preflight-twitch-chat-lurker.sh"
      - "scripts/stream-watcher.sh"
      - "scripts/tests/test-stalker-durable-failures.bats"
      - "scripts/twitch-chat-lurker.ts"
      - ".github/workflows/stalker-chat.yml"
      - "bun.lockb"
      - "package.json"
  push:
    branches: [master]
    paths:
      - "scripts/build-twitch-chat-lurker.sh"
      - "scripts/dist/twitch-chat-lurker.js"
      - "scripts/dist/twitch-chat-lurker.LICENSE.txt"
      - "scripts/lib/stream-helpers.sh"
      - "scripts/preflight-twitch-chat-lurker.sh"
      - "scripts/stream-watcher.sh"
      - "scripts/tests/test-stalker-durable-failures.bats"
      - "scripts/twitch-chat-lurker.ts"
      - ".github/workflows/stalker-chat.yml"
      - "bun.lockb"
      - "package.json"

permissions:
  contents: read

jobs:
  deploy-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Verify bundled chat deploy and readiness preflight
        run: bun run test:stalker-chat
