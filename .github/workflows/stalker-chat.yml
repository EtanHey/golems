name: stalker-chat

on:
  pull_request:
    paths:
      - "scripts/stalker/build-twitch-chat-lurker.sh"
      - "scripts/lib/stream-helpers.sh"
      - "scripts/lib/stream/**"
      - "scripts/stalker/post-stream.sh"
      - "scripts/stalker/process-stream.sh"
      - "scripts/stalker/process/**"
      - "scripts/tests/process-stream-contract.py"
      - "scripts/tests/stream_background_contract.py"
      - "scripts/tests/fixtures/process-stream-contract/**"
      - "scripts/tests/test-process-stream-agy-cli.bats"
      - "scripts/tests/test-post-stream-tail-gate.bats"
      - "scripts/stalker/preflight-twitch-chat-lurker.sh"
      - "scripts/stalker/stream-watcher.sh"
      - "scripts/tests/test-stalker-durable-failures.bats"
      - "scripts/stalker/twitch-chat-lurker.ts"
      - ".github/workflows/stalker-chat.yml"
      - "bun.lock"
      - "package.json"
  push:
    branches: [master]
    paths:
      - "scripts/stalker/build-twitch-chat-lurker.sh"
      - "scripts/lib/stream-helpers.sh"
      - "scripts/lib/stream/**"
      - "scripts/stalker/post-stream.sh"
      - "scripts/stalker/process-stream.sh"
      - "scripts/stalker/process/**"
      - "scripts/tests/process-stream-contract.py"
      - "scripts/tests/stream_background_contract.py"
      - "scripts/tests/fixtures/process-stream-contract/**"
      - "scripts/tests/test-process-stream-agy-cli.bats"
      - "scripts/tests/test-post-stream-tail-gate.bats"
      - "scripts/stalker/preflight-twitch-chat-lurker.sh"
      - "scripts/stalker/stream-watcher.sh"
      - "scripts/tests/test-stalker-durable-failures.bats"
      - "scripts/stalker/twitch-chat-lurker.ts"
      - ".github/workflows/stalker-chat.yml"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

jobs:
  deploy-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache apt downloads (bats)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Exclude root-owned locks and incomplete downloads.
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ runner.os }}-${{ runner.arch }}-apt-stalker-bats-v1

      - name: Install Bats
        timeout-minutes: 10
        run: sudo CI_APT_ARCHIVES_DIR="${{ runner.temp }}/apt-archives" bash scripts/ci/apt-install.sh bats
      - name: Verify bundled chat deploy and completion ordering
        run: |
          bun run test:stalker-chat
          bats scripts/tests/test-post-stream-tail-gate.bats
          bats scripts/tests/test-process-stream-agy-cli.bats
          python3 scripts/tests/process-stream-contract.py
