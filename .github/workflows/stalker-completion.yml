name: stalker-completion
on:
  pull_request:
    paths:
      - 'scripts/stalker-*.mjs'
      - 'scripts/process-stream.sh'
      - 'scripts/post-stream.sh'
      - 'scripts/stream-overnight-monitor.sh'
      - 'scripts/tests/stalker-*.test.mjs'
      - 'scripts/tests/fixtures/stalker-*'
      - 'packages/claude/src/lib/notify-server*'
      - '.github/workflows/stalker-completion.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/process-stream.sh'
      - 'scripts/post-stream.sh'
      - 'scripts/stream-overnight-monitor.sh'
      - 'scripts/tests/fixtures/stalker-*'
      - 'scripts/stalker-*.mjs'
      - 'scripts/tests/stalker-*.test.mjs'
      - 'packages/claude/src/lib/notify-server*'
      - '.github/workflows/stalker-completion.yml'
permissions:
  contents: read
jobs:
  completion-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify delivery contract
        run: node --test scripts/tests/stalker-run-contract.test.mjs scripts/tests/stalker-publish.test.mjs scripts/tests/stalker-dashboard.test.mjs scripts/tests/stalker-digest-runner.test.mjs scripts/tests/stalker-digest-batches.test.mjs scripts/tests/stalker-digest-evidence.test.mjs scripts/tests/stalker-human-digest.test.mjs scripts/tests/stalker-complete-run.test.mjs scripts/tests/stalker-morning-digest.test.mjs scripts/tests/stalker-pipeline-wiring.test.mjs scripts/tests/stalker-digest-curation.test.mjs scripts/tests/stalker-digest-text.test.mjs scripts/tests/stalker-drive-archive.test.mjs scripts/tests/stalker-media-retention.test.mjs
  notification-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Verify notification HTTP delivery receipts
        run: bun test packages/claude/src/bot-shared.test.ts packages/claude/src/lib/notify-server.test.ts
