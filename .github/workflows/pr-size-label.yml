# Correct under-reporting labels on same-repo PRs; forks retain failure.
# L requires a size-why: line; missing labels still warn.
name: pr-size-label

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-size-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  size-label-check:
    name: Check PR size label truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check size label against hand-written lines
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: bash scripts/ci/pr-size-labels.sh check "$PR_NUMBER" --repo "$PR_REPO"
