name: golem-powers-skill-tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python-skill-tests:
    name: Python skill test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run golem-powers Python skill suites
        run: scripts/run-skill-tests.sh

  shell-skill-tests:
    name: Shell skill test suites (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: golem-install symlink invariants
        run: |
          bats scripts/tests/test-cleanup-legacy-commands.bats \
               scripts/tests/test-golem-install-validate.bats

      - name: PR size-label script
        run: bats scripts/tests/test-pr-size-labels.bats

      # The three steps above are a hand-kept enumeration, and that list is the
      # bug: scripts/tests/ holds 14 .bats files, so 11 suites had no CI at all
      # and two of them sat red on master inside a green pipeline. This step
      # globs the directory so a suite is visible the day it lands, with no
      # workflow edit to remember.
      #
      # Why warn and not fail (2026-09-06): two suites are red on master today.
      # A blocking gate over a known-red directory is worse than the gap it
      # closes — same shape and same reason as the warn job in pr-size-label.yml.
      # Drop `continue-on-error` once scripts/tests/ is green.
      - name: Whole scripts/tests directory (non-blocking)
        continue-on-error: true
        run: |
          set -uo pipefail
          tap="$RUNNER_TEMP/bats-all.tap"
          # GitHub runs this with `bash -e`, so the failing bats pipeline would
          # abort the step right here and the summary below would never be
          # written. Suspend -e across exactly that pipeline and carry its exit
          # status by hand.
          set +e
          bats --tap scripts/tests/*.bats | tee "$tap"
          status=${PIPESTATUS[0]}
          set -e
          ok=$(grep -c '^ok ' "$tap" || true)
          not_ok=$(grep -c '^not ok ' "$tap" || true)
          failures=$(grep '^not ok ' "$tap" || true)
          {
            printf '## scripts/tests — %s ok, %s not ok\n\n' "$ok" "$not_ok"
            if [ -n "$failures" ]; then
              printf 'Failing tests:\n\n'
              printf '%s\n' "$failures" | sed 's/^/- `/; s/$/`/'
            else
              printf 'Every suite in `scripts/tests/` passed.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failures" ]; then
            printf '%s\n' "$failures" | while IFS= read -r line; do
              printf '::warning file=scripts/tests::%s\n' "$line"
            done
          fi
          exit "$status"
