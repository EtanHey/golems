name: golem-powers-skill-tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python-skill-tests:
    name: Python skill test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run golem-powers Python skill suites
        run: scripts/run-skill-tests.sh

  shell-skill-tests:
    name: Shell skill test suites (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: golem-install symlink invariants
        run: |
          bats scripts/tests/test-cleanup-legacy-commands.bats \
               scripts/tests/test-golem-install-validate.bats

      - name: PR size-label script
        run: bats scripts/tests/test-pr-size-labels.bats
