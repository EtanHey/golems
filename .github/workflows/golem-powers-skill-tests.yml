name: golem-powers-skill-tests

on:
  # No branches filter on pull_request: a PR stacked on another PR's branch has
  # to get CI too. With `branches: [master]` a PR into any other base ran none
  # of this workflow, which is how a stacked PR reached "green" having tested
  # nothing. push stays master-only so a feature-branch push does not run this
  # a second time alongside its own PR.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  # Nightly full run: the semantic-mutant step only runs on PRs that touch its
  # inputs (scripts/ci/mutant-inputs-changed.sh), so master gets it here.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every packages/* test file. Before this job, 106 of the 108 ran in no workflow.
  package-tests:
    name: Package test suite (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # A bun test arg without a leading ./ is a substring FILTER, not a path:
      # `bun test packages/*/src/__tests__/` also collected every copy of the
      # repo checked out under the gitignored docs.local/ on a dev machine.
      # The root script is `bun test ./packages`, a real path.
      # This planted failing test proves it: if docs.local/ is ever collected
      # again, the job goes red. It sits under a real package name because the
      # old filter only matched paths containing packages/<existing>/src/__tests__/.
      - name: Plant docs.local canary
        run: |
          mkdir -p docs.local/ci-canary/packages/shared/src/__tests__
          printf '%s\n' 'import { expect, test } from "bun:test";' \
            'test("docs.local canary must never be collected", () => { expect("collected").toBe("ignored"); });' \
            > docs.local/ci-canary/packages/shared/src/__tests__/canary.test.ts

      # The `golems setup --check` test (golem-skills) needs a `claude` binary on PATH
      # (REQUIRED_DEPS is bun, git, claude) and the runner has none. A stub
      # meets that precondition without installing Claude Code.
      - name: Stub the claude CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "claude 0.0.0 (CI stub)"\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run package tests
        run: bun run test

  # Suites that sat in no workflow. Each list is explicit.
  script-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Script test suites (bun, node, sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      # 3.9 is listed first so the default stays 3.11; hooks-interpreter-parity
      # runs the launcher and policy hooks under python3.9 as well.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: |
            3.9
            3.11

      # Installer integration tests execute the isolated regression runner.
      - run: python -m pip install pytest pyflakes==4.0.0 PyYAML

      - name: Regression gate contracts
        run: python -m pytest scripts/tests/test_private_regression_gate.py -q

      - name: Workspace lifecycle guards and lane helper
        run: >-
          python -m pytest -q scripts/tests/test_workspace_lease.py
          scripts/tests/test_workspace_lane.py scripts/tests/test_workspace_retire.py
          scripts/tests/test_workspace_preservation.py scripts/tests/test_workspace_regenerable_walk.py

      - name: Global instruction installer (synthetic HOME only)
        run: python -m pytest scripts/tests/test_global_instructions.py -q

      - name: M1 sync offline guards (fake SSH only)
        run: |
          python -B -m unittest discover -s scripts/tests -p test_m1_sync.py
          python -B -m unittest discover -s scripts/tests -p test_m1_receipt_real_writer.py
          python3.9 -B -m unittest discover -s scripts/tests -p test_m1_sync.py

      - run: bun install --frozen-lockfile

      # reconcile-to-mac: the retire-law tests spawn zsh, and the CLI dry run
      # resolves its profile's sourceRef (origin/master), which a PR checkout lacks.
      - name: Cache apt downloads (zsh)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Exclude root-owned locks and incomplete downloads.
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-apt-script-zsh-v1

      - name: reconcile-to-mac prerequisites
        timeout-minutes: 10
        run: |
          sudo CI_APT_ARCHIVES_DIR="${{ runner.temp }}/apt-archives" bash scripts/ci/apt-install.sh zsh
          git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - name: Additional Python script suites
        run: |
          python -m pytest scripts/tests/test_agent_browser.py -q
          python -m pytest scripts/tests/test_block_dangerous_commands.py -q
          python -m pytest scripts/tests/test_canary_plugin.py -q
          python -m pytest scripts/tests/test_cleanup_receipt_guidance.py -q
          python -m pytest scripts/tests/test_cmuxlayer_off.py -q
          python -m pytest scripts/tests/test_codex_hooks_native.py -q
          python -m pytest scripts/tests/test_codex_hooks_required.py -q
          python -m pytest scripts/tests/test_codex_policy_hook.py -q
          python -m pytest scripts/tests/test_codex_worker_routing_guidance.py -q
          python -m pytest scripts/tests/test_daemon_gate_precheck.py -q
          python -m pytest scripts/tests/test_deepsource_issues.py -q
          python -m pytest scripts/tests/test_disk_available.py -q
          python -m pytest scripts/tests/test_frontend_proof_guidance.py -q
          python -m pytest scripts/tests/test_gemini_brain_worker.py -q
          python -m pytest scripts/tests/test_gemini_context.py -q
          python -m pytest scripts/tests/test_gemini_templates.py -q
          python -m pytest scripts/tests/test_gemini_video_qa.py -q
          python -m pytest scripts/tests/test_heavy_suite_lock.py -q
          python -m pytest scripts/tests/test_heavy_suite_nested_records.py -q
          python -m pytest scripts/tests/test_heavy_suite_optin.py -q
          python -m pytest scripts/tests/test_heavy_suite_timeout.py -q
          python -m pytest scripts/tests/test_hook_import_fail_closed.py -q
          python -m pytest scripts/tests/test_installed_skill_live_config.py -q
          python -m pytest scripts/tests/test_installed_skill_parity.py -q
          python -m pytest scripts/tests/test_lifecycle_no_temp_clones.py -q
          python -m pytest scripts/tests/test_mutant_inputs_changed.py -q
          python -m pytest scripts/tests/test_pr_watch.py -q
          python -m pytest scripts/tests/test_pyyaml_runtime.py -q
          python -m pytest scripts/tests/test_run_skill_tests.py -q
          python -m pytest scripts/tests/test_stalker_admission.py -q
          python -m pytest scripts/tests/test_stalker_runtime_context.py -q
          python -m pytest scripts/tests/test_status_collab_settle_guidance.py -q
          python -m pytest scripts/tests/test_t3_deep_scan_interim_guidance.py -q
          python -m pytest scripts/tests/test_t3_settle_detach_guidance.py -q
          python -m pytest scripts/tests/test_workspace_generation.py -q
          python -m pytest scripts/tests/test_workspace_shared_holds.py -q
          python -m pytest scripts/tests/test_worktree_deps_guidance.py -q
          python -m pytest scripts/tests/test_worktree_disk_floor.py -q

      - name: bun suites
        run: |
          bun test ./scripts/tests/ratchet-codex-native.test.mjs
          bun test ./scripts/tests/ratchet-parity-expiry.test.mjs
          bun test ./scripts/tests/stalker-launchd-adoption.test.mjs
          bun test ./scripts/tests/t3-project-parity.test.mjs
          bun test ./scripts/tests/t3-provider-parity.test.mjs
          bun --no-install test ./scripts/tests/repogolem-mcp-deny.test.ts
          bun --no-install test ./scripts/tests/worktree-census-core.test.ts
          bun --no-install test ./scripts/tests/worktree-census-lexical.test.ts
          bun --no-install test ./scripts/tests/worktree-census-esrch.test.ts
          bun --no-install test ./scripts/tests/worktree-census-jcs.test.ts
          bun --no-install test ./scripts/tests/worktree-census-shape.test.ts
          bun test ./scripts/tests/pr-sentinel.test.mjs \
                   ./scripts/tests/claude-rules-frontmatter.test.mjs \
                   ./scripts/tests/canon-drift-lint.test.mjs \
                   ./scripts/tests/design-skill-updates.test.mjs \
                   ./scripts/tests/deploy-drift-check.test.mjs \
                   ./scripts/tests/launchd-portability.test.mjs \
                   ./scripts/tests/launchd-install.test.mjs \
                   ./scripts/tests/reconcile-to-mac.test.mjs \
                   ./scripts/tests/release-gate.test.mjs \
                   ./scripts/tests/ratchet-table.test.mjs \
                   ./scripts/tests/ratchet-run-rows.test.mjs \
                   ./scripts/tests/ratchet-check-comment.test.mjs \
                   ./scripts/tests/ratchet-mac.test.mjs \
                   ./scripts/tests/ratchet-pre-push.test.mjs \
                   ./scripts/tests/ratchet-debt.test.mjs \
                   ./scripts/tests/ratchet-live-freshness.test.mjs \
                   ./scripts/tests/ratchet-post-merge.test.mjs \
                   ./scripts/tests/ratchet-perf.test.mjs \
                   ./scripts/tests/repogolem-agents.test.ts \
                   ./scripts/tests/repogolem-managed-agents.test.ts \
                   ./scripts/tests/repogolem-values.test.ts \
                   ./scripts/tests/repogolem-varlock.test.ts \
                   ./scripts/tests/repogolem-config.test.ts \
                   ./scripts/tests/repogolem-mcp-argv.test.ts \
                   ./scripts/tests/repogolem-machines.test.ts \
                   ./scripts/tests/repogolem-secrets.test.ts \
                   ./scripts/tests/repogolem-selfsignin.test.ts \
                   ./scripts/tests/repogolem-runtime.test.ts \
                   ./scripts/tests/repogolem-install.test.ts \
                   ./scripts/tests/repogolem-sync.test.ts \
                   ./scripts/tests/repogolem-env-classifier.test.ts \
                   ./scripts/tests/skill-description-cap.test.mjs \
                   ./scripts/tests/skill-kickoff-contract.test.mjs \
                   ./scripts/tests/cross-machine-skills.test.mjs \
                   ./scripts/tests/lead-skill-etan-rules-contract.test.mjs \
                   ./scripts/tests/pr-loop-root-ff.test.mjs \
                   ./scripts/tests/hooks-fail-open.test.mjs \
                   ./scripts/tests/hooks-planted-module.test.mjs \
                   ./scripts/tests/hooks-interpreter-parity.test.mjs \
                   ./scripts/tests/codex-hooks-install.test.mjs \
                   ./scripts/tests/codex-planted-module.test.mjs \
                   ./scripts/tests/install-hooks.test.mjs \
                   ./scripts/tests/release-hooks.test.mjs \
                   ./scripts/cc/cc-statusline.test.ts \
                   ./scripts/cc/cc-axiom-reporter.test.ts \
                   ./skills/golem-powers/never-fabricate/scripts/__tests__ \
                   ./skills/golem-powers/drive-filing/scripts \
                   ./skills/golem-powers/skill-creator/evals/eval-provenance.test.mjs

      - name: Check canon routing SSOT
        run: |
          scans=()
          while IFS= read -r -d '' file; do
            scans+=(--routing-scan "$file")
          done < <(git ls-files -z 'skills/**/*.md')
          node scripts/ci/canon-drift-lint.mjs --check \
            --routing-allowlist scripts/ci/routing-restatement-allowlist.json "${scans[@]}"

      - name: node suites
        run: |
          node --test scripts/tests/install-receipt-status.test.mjs
          node --test scripts/tests/prepush-selection.test.mjs
          node --test scripts/tests/skills-sync-receipt.test.mjs
          node --test scripts/tests/stalker-card-media.test.mjs
          node --test scripts/tests/stalker-complete-run.test.mjs
          node --test scripts/tests/stalker-dashboard.test.mjs
          node --test scripts/tests/stalker-digest-batches.test.mjs
          node --test scripts/tests/stalker-digest-evidence.test.mjs
          node --test scripts/tests/stalker-digest-runner.test.mjs
          node --test scripts/tests/stalker-digest-text.test.mjs
          node --test scripts/tests/stalker-drive-archive.test.mjs
          node --test scripts/tests/stalker-media-retention.test.mjs
          node --test scripts/tests/stalker-morning-digest.test.mjs
          node --test scripts/tests/stalker-pipeline-wiring.test.mjs
          node --test scripts/tests/stalker-publish.test.mjs
          node --test scripts/tests/stalker-run-contract.test.mjs
          node --test scripts/vercel-budget.test.mjs
          node --test scripts/tests/prepush-touched.test.mjs
          node --test scripts/tests/ratchet-guarded-set.test.mjs
          node --test scripts/tests/prune-runs.test.mjs
          node --test scripts/tests/pr-wait-hygiene.test.mjs
          node --test scripts/tests/install-receipt.test.mjs \
                      scripts/tests/t3-mcp-holders.test.mjs \
                      scripts/tests/golems-receipt-core.test.mjs \
                      scripts/tests/receipt-validator-build.test.mjs \
                      scripts/tests/container-teardown.test.mjs \
                      scripts/tests/pr-chain-span.test.mjs \
                      scripts/tests/bats-coverage.test.mjs \
                      scripts/tests/codex-internal-role.test.mjs \
                      scripts/tests/google-drive-oauth-guard.test.mjs \
                      scripts/tests/stalker-morning-launchd.test.mjs \
                      scripts/tests/stalker-model-roles.test.mjs \
                      scripts/tests/stalker-human-digest.test.mjs \
                      scripts/tests/stalker-digest-curation.test.mjs \
                      skills/golem-powers/agent-routing/scripts/launch-guard.test.mjs \
                      scripts/tests/check-telegram-retirement.test.mjs

      - name: shell suites
        run: |
          bash scripts/tests/materialize-deep-security-plan.test.sh
          bash skills/golem-powers/gemini-research/scripts/__tests__/drive-sync.test.sh
          bash skills/golem-powers/claude-desktop-research/scripts/__tests__/migrate-obsidian-to-drive.test.sh

  python-skill-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Python skill test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # pristine harness reads immutable base blobs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'

      - name: Detect mutation-proof inputs
        id: mutant-paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/mutant-inputs-changed.sh "$BASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest pytest-xdist==3.8.0

      - name: Install config parser for Python skill suites
        run: python -m pip install PyYAML

      - name: Cache apt downloads (zsh jq lsof)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Exclude root-owned locks and incomplete downloads.
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-apt-python-zsh-jq-lsof-v1

      - name: Install launcher harness tools
        timeout-minutes: 10
        run: sudo CI_APT_ARCHIVES_DIR="${{ runner.temp }}/apt-archives" bash scripts/ci/apt-install.sh zsh jq lsof

      - name: Run golem-powers Python skill suites
        run: scripts/ci/run-skill-tests.sh

      - name: Install JEV test certificate dependency
        run: python -m pip install certifi

      - name: JEV Python package tests
        run: python -m pytest packages/shared/src/__tests__/test_jev.py -q

      - name: Preserve split comments and their locations
        run: python scripts/ci/check-split-comments.py

      - name: Enforce Telegram retirement
        run: node scripts/ci/check-telegram-retirement.mjs

      # These harness regressions belong with the full-history checkout above.
      - name: Pristine harness regression suites
        run: python -m pytest scripts/tests/test_pristine_deltas.py scripts/tests/test_pristine_tmpblock_api.py -q

      - name: Pristine split baseline gate
        run: python scripts/ci/pristine-harness.py check

      - name: Verify immutable Python and launcher goldens
        run: python scripts/ci/pristine-harness.py verify-goldens

      - name: Catch all required semantic policy mutants
        # ~36 min: PRs that touch its inputs, nightly master, or manual runs.
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && steps.mutant-paths.outputs.relevant == 'true')
        run: python scripts/ci/pristine-harness.py mutation-proof

  shell-skill-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Shell skill test suites (bats)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'

      # zsh, ripgrep and bun are what the suites in scripts/tests/ actually shell
      # out to, and the runner image ships none of them. Measured in run
      # 33994270754: 82 of the 90 failures were `exited with code 127,
      # indicating 'Command not found'` -- 75 direct `zsh` invocations, 5
      # env-wrapped scripts that drive the zsh dispatcher, 1 `run_claude`, and
      # build-twitch-chat-lurker.sh, which needs bun. Plus one `rg: command not
      # found`. jq, timeout, python3, npm and shellcheck are used by the suites
      # too, but the runner already has them, so they are not installed here.
      # ffmpeg: the qa-video dense-windows suite renders synthetic video.
      # Keep its required libraries (including libpocketsphinx), but omit
      # recommended packages such as the unused pocketsphinx-en-us model.
      - name: Cache apt downloads (bats zsh ripgrep ffmpeg)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Exclude root-owned locks and incomplete downloads.
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-apt-bats-bats-zsh-ripgrep-ffmpeg-v1

      - name: Install bats, zsh, ripgrep and ffmpeg
        # Three stalled updates can take 450s, plus the install. Keep a hard
        # outer cap even if repeated update/install failures exhaust that budget.
        timeout-minutes: 10
        run: sudo CI_APT_ARCHIVES_DIR="${{ runner.temp }}/apt-archives" bash scripts/ci/apt-install.sh bats zsh ripgrep ffmpeg

      # .bun-version is the repo's single bun pin; every workflow reads it
      # through bun-version-file rather than carrying a literal. The stalker
      # suites here assert the committed Twitch chat bundle is byte-identical
      # to a fresh build, which only holds on the pinned version.
      # scripts/tests/test-bun-version-pin.bats stops the literals returning.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Guard scripts/tests Bats coverage
        run: node scripts/ci/run-bats-suites.mjs --check

      - name: Lint Bash 3.2 assertions
        run: node scripts/ci/check-bats-bash32.mjs

      - name: Verify Bash 3.2 assertion checker
        run: node --test scripts/tests/check-bats-bash32.test.mjs

      - name: Verify non-final Bats assertions fail
        run: node --test scripts/tests/bats-assertions.test.mjs

      # Every manifest entry runs once and blocks CI. Each file has a 180s
      # timeout: test-repogolem-dispatch.bats has previously hung waiting for
      # its concurrent Codex profiles' release sentinel (formerly line 2523).
      - name: Run every registered Bats suite
        run: node scripts/ci/run-bats-suites.mjs --run
