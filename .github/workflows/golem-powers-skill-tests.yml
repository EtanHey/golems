name: golem-powers-skill-tests

on:
  # No branches filter on pull_request: a PR stacked on another PR's branch has
  # to get CI too. With `branches: [master]` a PR into any other base ran none
  # of this workflow, which is how a stacked PR reached "green" having tested
  # nothing. push stays master-only so a feature-branch push does not run this
  # a second time alongside its own PR.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  eval-composition-tests:
    name: Eval composition tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run focused composition tests
        run: node --test skill-evals/helpers/compose-skill.test.js

  # Every packages/* test file. Before this job, 106 of the 108 ran in no workflow.
  package-tests:
    name: Package test suite (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # A bun test arg without a leading ./ is a substring FILTER, not a path:
      # `bun test packages/*/src/__tests__/` also collected every copy of the
      # repo checked out under the gitignored docs.local/ on a dev machine.
      # The root script is `bun test ./packages`, a real path.
      # This planted failing test proves it: if docs.local/ is ever collected
      # again, the job goes red. It sits under a real package name because the
      # old filter only matched paths containing packages/<existing>/src/__tests__/.
      - name: Plant docs.local canary
        run: |
          mkdir -p docs.local/ci-canary/packages/shared/src/__tests__
          printf '%s\n' 'import { expect, test } from "bun:test";' \
            'test("docs.local canary must never be collected", () => { expect("collected").toBe("ignored"); });' \
            > docs.local/ci-canary/packages/shared/src/__tests__/canary.test.ts

      # The `golems setup --check` test (golem-skills) needs a `claude` binary on PATH
      # (REQUIRED_DEPS is bun, git, claude) and the runner has none. A stub
      # meets that precondition without installing Claude Code.
      - name: Stub the claude CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "claude 0.0.0 (CI stub)"\n' > "$RUNNER_TEMP/bin/claude"
          chmod +x "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run package tests
        run: bun run test

  # Suites that sat in no workflow. Each list is explicit.
  script-tests:
    name: Script test suites (bun, node, sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # reconcile-to-mac: the retire-law tests spawn zsh, and the CLI dry run
      # resolves its profile's sourceRef (origin/master), which a PR checkout lacks.
      - name: reconcile-to-mac prerequisites
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - name: bun suites
        run: |
          bun test ./scripts/tests/canon-drift-lint.test.mjs \
                   ./scripts/tests/deploy-drift-check.test.mjs \
                   ./scripts/tests/launchd-portability.test.mjs \
                   ./scripts/tests/reconcile-to-mac.test.mjs \
                   ./scripts/tests/release-gate.test.mjs \
                   ./scripts/tests/repogolem-config.test.ts \
                   ./scripts/tests/skill-description-cap.test.mjs \
                   ./scripts/tests/hooks-fail-open.test.mjs \
                   ./scripts/tests/install-hooks.test.mjs \
                   ./scripts/cc/cc-usage/__tests__ \
                   ./scripts/cc/cc-statusline.test.ts \
                   ./skills/golem-powers/never-fabricate/scripts/__tests__ \
                   ./skills/golem-powers/drive-filing/scripts

      - name: node suites
        run: |
          node --test scripts/tests/google-drive-oauth-guard.test.mjs \
                      scripts/tests/stalker-morning-launchd.test.mjs \
                      scripts/tests/scripts-compat-shims-sync.test.mjs

      - name: shell suites
        run: |
          bash scripts/tests/claude-learning-workflow.test.sh
          bash scripts/tests/materialize-deep-security-plan.test.sh
          bash skills/golem-powers/gemini-research/scripts/__tests__/drive-sync.test.sh
          bash skills/golem-powers/claude-desktop-research/scripts/__tests__/migrate-obsidian-to-drive.test.sh

  python-skill-tests:
    name: Python skill test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run golem-powers Python skill suites
        run: scripts/run-skill-tests.sh

  shell-skill-tests:
    name: Shell skill test suites (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # zsh, ripgrep and bun are what the suites in scripts/tests/ actually shell
      # out to, and the runner image ships none of them. Measured in run
      # 33994270754: 82 of the 90 failures were `exited with code 127,
      # indicating 'Command not found'` -- 75 direct `zsh` invocations, 5
      # env-wrapped scripts that drive the zsh dispatcher, 1 `run_claude`, and
      # build-twitch-chat-lurker.sh, which needs bun. Plus one `rg: command not
      # found`. jq, timeout, python3, npm and shellcheck are used by the suites
      # too, but the runner already has them, so they are not installed here.
      - name: Install bats, zsh and ripgrep
        run: sudo apt-get update && sudo apt-get install -y bats zsh ripgrep

      # .bun-version is the repo's single bun pin; every workflow reads it
      # through bun-version-file rather than carrying a literal. The stalker
      # suites here assert the committed Twitch chat bundle is byte-identical
      # to a fresh build, which only holds on the pinned version.
      # scripts/tests/test-bun-version-pin.bats stops the literals returning.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: golem-install symlink invariants
        run: |
          bats scripts/tests/test-cleanup-legacy-commands.bats \
               scripts/tests/test-golem-install-validate.bats \
               scripts/tests/test-skill-catalog-lint.bats

      - name: PR size-label script
        run: bats scripts/tests/test-pr-size-labels.bats

      - name: repoGolem worktree bootstrap
        run: bats scripts/tests/test-worktree-bootstrap.bats

      - name: qa-video package contract
        run: bats scripts/tests/test-qa-video-package.bats

      - name: hook installer guards (hooks-live gc exemption, wired-hook symlink refusal)
        run: bats scripts/tests/test-worktree-gc.bats scripts/tests/test-install-wired-hook.bats scripts/tests/test-wired-hook-shared-parser.bats

      # Blocking since GO-6: its launcher tests went red on master (the payload
      # omitted worktree-bootstrap.sh) and only the warn-only glob below saw it.
      - name: golems-sync installer contract
        run: bats scripts/tests/test-golems-sync.bats

      # Blocking, unlike the whole-directory glob below: this suite is the guard
      # that keeps the bun pin single, and a guard that only warns does not stop
      # the drift it exists to catch.
      - name: Single bun pin, no workflow literals
        run: bats scripts/tests/test-bun-version-pin.bats

      # The seven steps above explicitly cover eleven .bats files. Every remaining
      # suite runs in the whole-directory step below, so new tests stay visible
      # without another hand-maintained workflow edit.
      #
      # Why warn and not fail (2026-09-06): two suites are red on master today.
      # A blocking gate over a known-red directory is worse than the gap it
      # closes — same shape and same reason as the warn job in pr-size-label.yml.
      # Drop `continue-on-error` once scripts/tests/ is green.
      # This step also runs every other .bats suite so each remains visible the
      # day it lands.
      #
      # Why warn and not fail: the directory is not green yet. A blocking gate
      # over a known-red directory is worse than the gap it closes -- same shape
      # and reason as the warn job in pr-size-label.yml.
      #
      # Why one bats call PER FILE, each bounded: bats has no per-test timeout,
      # and `tracked dispatcher source isolates concurrent Codex profiles for
      # the same project` (test 208, test-repogolem-dispatch.bats:2523) hangs
      # forever -- its stubbed `codex` busy-waits on a release sentinel that
      # never appears on the runner. A single whole-directory call therefore ran
      # 46 minutes and reported nothing. Per-file bounds cap the damage at one
      # file and let every other suite still report, which is the only way to
      # get a complete count while that test hangs. 180s is ~3x the ~60s the
      # whole healthy directory took on the runner.
      - name: Whole scripts/tests directory (non-blocking)
        continue-on-error: true
        run: |
          set -uo pipefail
          fails="$RUNNER_TEMP/fails.txt"; : > "$fails"
          hung="$RUNNER_TEMP/hung.txt"; : > "$hung"
          ok=0
          not_ok=0
          set +e
          for f in scripts/tests/*.bats; do
            name="$(basename "$f")"
            out="$RUNNER_TEMP/$name.tap"
            timeout --kill-after=10s 180s bats --tap "$f" > "$out" 2>&1
            rc=$?
            cat "$out"
            ok=$(( ok + $(grep -c '^ok ' "$out") ))
            not_ok=$(( not_ok + $(grep -c '^not ok ' "$out") ))
            sed -n "s/^not ok [0-9]* /$name: /p" "$out" >> "$fails"
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              printf '%s\n' "$name" >> "$hung"
            fi
          done
          set -e
          {
            printf '## scripts/tests — %s ok, %s not ok\n\n' "$ok" "$not_ok"
            if [ -s "$hung" ]; then
              printf '**Timed out after 180s, so their remaining tests are in neither count:**\n\n'
              sed 's/^/- `/; s/$/`/' "$hung"
              printf '\n'
            fi
            if [ -s "$fails" ]; then
              printf 'Failing tests:\n\n'
              sed 's/^/- `/; s/$/`/' "$fails"
            elif [ ! -s "$hung" ]; then
              printf 'Every suite in `scripts/tests/` passed.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            printf '::warning file=scripts/tests::%s\n' "$line"
          done < "$fails"
          while IFS= read -r line; do
            printf '::warning file=scripts/tests::%s timed out after 180s\n' "$line"
          done < "$hung"
          if [ -s "$fails" ] || [ -s "$hung" ]; then exit 1; fi
