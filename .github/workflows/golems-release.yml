name: Golems release

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun test ./scripts/tests/build-release.test.mjs ./scripts/tests/release-gate.test.mjs ./skills/golem-powers/golem-install/scripts/repo-action.test.mjs
      - name: Build twice and validate the release contract independently
        run: |
          node scripts/release/build-release.mjs --commit "$GITHUB_SHA" --out dist/first
          node scripts/release/build-release.mjs --commit "$GITHUB_SHA" --out dist/second
          cmp dist/first/MANIFEST.json dist/second/MANIFEST.json
          cmp dist/first/SHA256SUMS dist/second/SHA256SUMS
          cmp dist/first/*.tar.gz dist/second/*.tar.gz
          (cd dist/first && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import glob, hashlib, json, tarfile
          with tarfile.open(glob.glob('dist/first/*.tar.gz')[0]) as archive:
              members = archive.getmembers()
              assert all(m.isfile() and m.uid == m.gid == m.mtime == 0 for m in members)
              assert all(not m.name.startswith('/') and '..' not in m.name.split('/') for m in members)
              manifest = json.load(archive.extractfile('MANIFEST.json'))
              assert {m.name for m in members} == {'MANIFEST.json'} | {f['path'] for f in manifest['files']}
              for entry in manifest['files']:
                  assert hashlib.sha256(archive.extractfile(entry['path']).read()).hexdigest() == entry['sha256']
                  assert archive.getmember(entry['path']).mode == int(entry['mode'], 8)
          PY

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: golems-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - name: Publish immutable release assets (reruns verify existing bytes)
        run: |
          node scripts/release/build-release.mjs --commit "$GITHUB_SHA" --out dist/release > dist-metadata.json
          version=$(node -p 'JSON.parse(require("fs").readFileSync("dist-metadata.json")).version')
          tag="v$version"
          # The tag endpoint omits drafts; list all pages so interrupted uploads
          # reuse their draft instead of creating another release for the tag.
          draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          if [ "$draft" = false ]; then
            gh release download "$tag" --dir dist/existing --pattern '*.tar.gz' --pattern MANIFEST.json --pattern SHA256SUMS
            cmp "dist/release/golems-$version.tar.gz" "dist/existing/golems-$version.tar.gz"
            cmp dist/release/MANIFEST.json dist/existing/MANIFEST.json
            cmp dist/release/SHA256SUMS dist/existing/SHA256SUMS
          elif [ "$draft" = true ]; then
            gh release upload "$tag" dist/release/* --clobber
          elif [ -z "$draft" ]; then
            gh release create "$tag" --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "Golems $version" --notes "Skills, CLIs and hooks from commit $GITHUB_SHA. See MANIFEST.json and SHA256SUMS for integrity checks." dist/release/*
          else
            printf 'Ambiguous release state for %s: %s\n' "$tag" "$draft" >&2
            exit 1
          fi
          gh release edit "$tag" --draft=false --prerelease --latest=false
