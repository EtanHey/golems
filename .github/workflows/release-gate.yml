name: Release gate

on:
  # Run after publication, avoiding a race with the master release build.
  workflow_run:
    workflows: [Golems release]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merged-unreleased:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Fail when shippable commits are unreleased
        run: node scripts/ci/release-gate.mjs . --release-only
