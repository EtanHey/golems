# Public-safe publication boundary policy snapshot.
# The ratified source of truth lives in docs.local and may add private markers
# on developer machines. Keep names, addresses, and other sensitive literals
# out of this committed snapshot.
version: 1
public_safe: true

allowlist:
  file: '.publish-boundary-allow'
  mechanics: 'explicit-paths-only'

relocate_path_patterns:
  - 'skills/golem-powers/weave/registry/RULES.md'
  - 'skills/golem-powers/cmux-agents/evals/fixtures/*-session-failure-*.txt'
  - 'skills/golem-powers/orc-workspace/iteration-2/historical-pain-points.md'
  - 'skills/golem-powers/_archive/client-management/*'
  - 'packages/jobs/src/mcp-server.ts'

symlink_rule: 'tracked-symlinks-must-resolve-inside-repository'

forbidden_classes:
  real-identifiers:
    patterns:
      - '((project[ _-]?(id|ref)?|supabase[ _-]?project)[^[:cntrl:]]{0,40}[:=][^[:cntrl:]]{0,8}[a-z0-9]{20}([^a-z0-9=]|$)|supabase[^[:cntrl:]]{0,40}[^a-z0-9][a-z0-9]{20}([^a-z0-9=]|$)|[a-z0-9]{20}[.]supabase[.]co|postgres[.:][a-z0-9]{20}([^a-z0-9]|$)|supabase[.]com/dashboard/project/[a-z0-9]{20})'
      - 'https://(docs[.]google[.]com/(document/d|spreadsheets/d|presentation/d|forms/d|drawings/d)|drive[.]google[.]com/(file/d|drive/folders))/[[:alnum:]_-]{20,}'
      - 'https://drive[.]google[.]com/open[?]id=[[:alnum:]_-]{20,}'
      - '[a-z0-9-]+[.][a-z0-9-]+[.]ts[.]net'
      - '((stitch|list_screens|projectId)[^[:cntrl:]]{0,80}(projects/)?[0-9]{15,})'
  telegram_chat_id:
    patterns:
      - '(-100[0-9]{10,}|["'']-100["''][[:space:]]*\+[[:space:]]*["''][0-9]{10,}["'']|["'']?(telegram[_]?chat[_]?id|chat[_]?id)["'']?[[:space:]]*[:=][[:space:]]*["'']?[0-9]{8,}["'']?)'
    allowed_patterns:
      - '((^|[^0-9])-1001234567890([^0-9]|$)|(^|[^0-9])123456789([^0-9]|$))'
  health:
    patterns:
      - '((recovery|readiness|sleep)([ -]score)?:[^[:cntrl:]]{0,40}[0-9]{1,3}%|(sleep[ -]schedule|bed[ -]?time|wake[ -]?time):[^[:cntrl:]]{0,40}[0-9]{1,2}:[0-9]{2}|injury (history|status):|left shoulder injury)'
  substance:
    patterns:
      - '((smoking|weed|tobacco|cannabis)[ -](frequency|protocol|habit|use)|smokes?[[:space:]]+weed|weed[[:space:]]+most)'
  raw-session:
    patterns:
      - '(raw type:user|session transcript|operator turn cite)'
  client-or-third-party:
    patterns:
      - '((client|customer)[ -](name|email|phone|jid):|third[- ]party PII:|NDA (terms|rate):|client transcript:)'
  finance-rate:
    patterns:
      - '[0-9]+[[:space:]]*(NIS|ILS)(/| per )(hr|hour)'
      - '(hourly|billing)[ -]rate:'
  finding-content:
    patterns:
      - 'occ_[0-9a-f]{24}'
      - '7609ee67(-[0-9a-f]{4}){3}-[0-9a-f]{12}'
    indexed_rule: 'finding-artifacts-hashes-only'
  identity-pii:
    patterns:
      - '[[:alnum:]._%+-]+@[[:alnum:].-]+[.][[:alpha:]]{2,}'
      - '\+972[0-9]{7,}'
      - '[0-9]{8,}@s[.]whatsapp[.]net'
      - '(home (address|city)|resume path):'
    allowed_patterns:
      - '[[:alnum:]._%+-]+@(example[.](com|org|net)|users[.]noreply[.]github[.]com)'
      - '(noreply@anthropic[.]com|(git|noreply)@github[.]com)'
  credential-adjacent:
    patterns:
      - '[A-Z][A-Z0-9_]*(TOKEN|SECRET|PASSWORD)[A-Z0-9_]*[[:space:]]*[:=][[:space:]]*(sk-|ghp_|github_pat_|sbp_|xox[baprs]-|AKIA)[[:alnum:]_./+-]{12,}'
      - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
  operator-verbatim:
    patterns:
      - '(fucking|WTAF|motherfuck|Etan raw|raw type:user)'
  publication-operational-data:
    patterns:
      - '/Users/[[:alnum:]_.-]+/'
      - '(/Users/[^/]+/Gits/golems/(docs[.]local|[.]worktrees)([^[:alnum:]]|$)|-Users-[[:alnum:]_.-]+-Gits-golems-(docs[.]local|[.]worktrees)([^[:alnum:]]|$))'
      - '((golems|cmuxlayer|brainlayer|voicelayer)(Codex|Claude)-[0-9a-f]{8}[^[:cntrl:]]{0,100}surface:[0-9]+|surface:[0-9]+[^[:cntrl:]]{0,100}(golems|cmuxlayer|brainlayer|voicelayer)(Codex|Claude)-[0-9a-f]{8})'
      - '(client engagement incident:|real client relationship:|stealth product (purpose|usage|metric):)'
      - '((archive|drive|root)[ _-]?folder[ _-]?id|archive_folder_id)[^[:cntrl:]]{0,40}[:=][^[:cntrl:]]{0,8}[[:alnum:]_-]{20,}'
      - '[|][[:space:]]*0[1-9]_[A-Z_]+[[:space:]]*[|][[:space:]]*[[:alnum:]_-]{20,}[[:space:]]*[|]'
    allowed_patterns:
      - '\$\{[A-Z0-9_]+\}'
  private-structure:
    patterns:
      - '/Users/[^/]+/Gits/(orchestrator|skill-creator|coach)(/|$)'
      - '~[/]Gits/(orchestrator|skill-creator|coach)([^[:alnum:]]|$)'
      - 'Gits/(orchestrator|skill-creator|coach)/docs[.]local'
      - '-Users-[[:alnum:]_.-]+-Gits-(orchestrator|skill-creator|coach)([^[:alnum:]]|$)'
  private_structure_slash_suffix:
    patterns:
      - '/Users/[^/]+/Gits/(orchestrator|skill-creator|coach)([^[:alnum:]]|$)'
  github_action_full_sha:
    indexed_rule: 'workflow-external-uses-full-sha'
  mcp_executable_exact_version:
    indexed_rule: 'runner-package-exact-version'
  synthetic_personal_fixture:
    indexed_rule: 'synthetic-personal-fixture-header'
