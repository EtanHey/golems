events {
    worker_connections 1024;
}

http {
    # Logging format with request/response details
    log_format ollama_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'request_time=$request_time '
                          'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/ollama_access.log ollama_log;
    error_log /var/log/nginx/ollama_error.log warn;

    # Upstream Ollama server
    upstream ollama {
        server ollama:11434;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body size for large prompts
        client_max_body_size 50M;

        # Timeouts for long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Proxy all requests to Ollama
        location / {
            proxy_pass http://ollama;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Streaming support for generate endpoint
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
